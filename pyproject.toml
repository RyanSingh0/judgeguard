[project]
name = "judgeguard"
version = "0.1.0"
description = "Measuring LLM judge reliability with degradation-generated gold labels, then shipping the calibrated judge as a sub-150ms inline guardrail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryan Meena" }]
keywords = ["llm-as-a-judge", "evaluation", "guardrails", "agent-trajectories", "calibration", "bootstrap"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "diskcache>=5.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "duckdb>=1.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "orjson>=3.10",
]

[project.optional-dependencies]
# Heavy, optional. The pipeline falls back to a hashing vectoriser if absent,
# so `uv sync` stays fast in CI and the repo runs on a laptop with no GPU.
embeddings = ["sentence-transformers>=3.0"]
# Experiment tracking. Code no-ops cleanly when MLflow is not installed.
track = ["mlflow>=2.14"]
# Distributed tracing / metrics for the serving path.
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "prometheus-client>=0.20",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "httpx>=0.27",
]
all = ["judgeguard[embeddings,track,otel,dev]"]

[project.scripts]
judgeguard = "judgeguard.cli:app"

[project.urls]
Homepage = "https://github.com/RyanSingh0/judgeguard"
Findings = "https://github.com/RyanSingh0/judgeguard/blob/main/docs/findings.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judgeguard"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "results", "docs/planning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N", "ARG", "PTH"]
# ARG002: provider `complete()` signatures must match the LLMProvider protocol
#         even when a backend ignores `meta`/`system`.
# UP042 : StrEnum needs 3.11+ only semantics we do not want in serialised configs.
ignore = ["E501", "B008", "RUF001", "RUF046", "N806", "ARG001", "ARG002", "UP042", "SIM108", "C408"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["T201", "E402"]
"tests/*" = ["ARG", "B011"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: takes more than a couple of seconds",
  "live: requires real provider API keys (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = []

# Fly.io deployment. Scale-to-zero so an always-on demo costs nothing.
app = "judgeguard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  JUDGEGUARD_PROVIDER_MODE = "auto"
  JUDGEGUARD_GUARD_P99_BUDGET_MS = "150"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

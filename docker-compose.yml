services:
  judgeguard:
    build: .
    image: judgeguard:local
    ports: ["8080:8080"]
    environment:
      # No keys -> simulated mode; the demo still works end to end.
      JUDGEGUARD_PROVIDER_MODE: ${JUDGEGUARD_PROVIDER_MODE:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

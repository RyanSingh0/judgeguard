name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest --cov=judgeguard --cov-report=term-missing
      - name: Types
        run: uv run mypy judgeguard || true

  browser-guardrail:
    # The static Space runs a JavaScript port of the distilled student. If it
    # ever stops agreeing with scikit-learn, the live demo is showing a
    # different model from the one the README describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --extra dev
      - name: Rebuild the exported model and the site
        run: |
          uv run python scripts/export_web_model.py
          uv run python scripts/build_site.py
      - name: Python/JavaScript parity
        run: node site/parity.test.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: judgeguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the container
        run: |
          docker run -d --name jg -p 8080:8080 judgeguard:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break || sleep 2
          done
          curl -sf http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf -X POST http://localhost:8080/guard \
            -H 'content-type: application/json' \
            -d '{"question":"q","answer":"The trial enrolled 3013 participants."}' | tee /dev/stderr | grep -q decision
          docker rm -f jg

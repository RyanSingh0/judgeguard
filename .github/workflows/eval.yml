name: evidence-and-replay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      JUDGEGUARD_PROVIDER_MODE: simulated
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra demo
      - name: Recompute the frozen real-model evidence
        run: uv run --no-sync python scripts/verify_pilot.py
      - name: Verify historical simulation snapshot
        run: uv run --no-sync python scripts/verify_claims.py
      - name: Test tool replay and hosted app callbacks
        run: uv run --no-sync pytest tests/test_trace_audit.py tests/test_gradio_workbench.py
      - name: Rebuild and compare the public demo data
        run: |
          uv run --no-sync python scripts/build_demo_bundle.py
          git diff --exit-code -- demo-data.json

# Validates shipped evaluator and frozen evidence, not fresh model inference or
# student quality. Manual student-promotion retains the strict quality gate.
